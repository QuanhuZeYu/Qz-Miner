name: Branch build

on:
  push:
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 单基线构建（对齐 Qz-UILib）：GTNH 基线唯一真源是 dependencies.gradle 的
  # elytraModpackVersion.setGtnhVersion(...) 单值声明；CI 不再解析 gradle/gtnh-baselines.json，
  # 也不再按基线矩阵分别构建。
  #
  # 验证定义唯一：本 job 与发布 workflow 共用 .github/actions/verify（工作站 发布流程.md §3），
  # 因此两处不会漂移。VERSION 前缀（5.3.4）是分支 CI 的定档常量，随版本定档更新这一处。
  #
  # 兼容承诺：运行期兼容范围含 GTNH 2.9.0-beta-2 与 2.9.0-beta-3；依据是源码对 GTNH 侧组件零静态链接
  # + 双基线编译实证（beta-2/beta-3 均 compileJava/compileTestJava 通过）；真机运行态未验证。
  # 双基线实证按工作站任务笔记的人工流程执行（临时切换基线编译后按原始字节恢复并校验 sha256）。
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout mod repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 32
          submodules: recursive

      - name: Verify
        uses: ./.github/actions/verify
        with:
          version: 5.3.4-ci+${{ github.sha }}
