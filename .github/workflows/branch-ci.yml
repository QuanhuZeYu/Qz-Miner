name: Branch build

on:
  push:
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 基线由 dependencies.gradle 单值声明；验证与发布共用同一 action，CI 版本随 major 定档。
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout mod repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 32
          submodules: recursive

      - name: Verify
        uses: ./.github/actions/verify
        with:
          version: 5.5.1-ci+${{ github.sha }}
