# 手动发布的唯一路径（对齐 Qz-UILib 的 Publish Release Assets）：
#   gh workflow run "Release" --ref <分支> -f tag=5.3.3 -f confirmation="PUBLISH 5.3.3"
#   gh run watch --exit-status
#
# 不用 tag push 自动触发：发布是显式动作，误打 tag 不产生任何发布副作用（工作站 发布流程.md §1/§3）。
# 发布自证：本 workflow 用 .github/actions/verify 跑 setupCIWorkspace / test / check / build，
# 不再要求「同一 SHA 有成功的分支 CI」，也不再依赖 tag 以外的任何外部记录。
# 动态证据（run 链接、提交、资产 sha256）由本 workflow 自动写入 Release notes 的「验证证据」节，
# 因此 .changelogs/<tag>.md 不回填这些内容。
#
# 注意：本 workflow 通过 `uses: ./.github/actions/verify` 引用仓库内 action，目标 tag 必须包含
# 该 action 所在提交（自本次 CI 改造落地起）。给更早的 SHA 补发布需先确认该提交含 action 目录。

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 目标 release tag，如 5.3.3
        required: true
        type: string
      confirmation:
        description: 键入 `PUBLISH <tag>` 确认发布
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.tag }}
      SNAPSHOT: ${{ endsWith(inputs.tag, '-snapshot') }}
      PRERELEASE: ${{ endsWith(inputs.tag, '-pre') }}
      MAVEN_PUBLISHING_URL: ${{ vars.MAVEN_PUBLISHING_URL || 'https://nexus.gtnewhorizons.com/repository/releases/' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 校验确认短语与 tag 格式
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = "PUBLISH ${TAG}"
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "invalid tag format: ${TAG}" >&2
            exit 1
          fi

      - name: Checkout 指定 tag 的不可变代码
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive

      - name: 校验 tag 对象与释放说明
        shell: bash
        run: |
          set -euo pipefail
          TAG_OBJECT="$(git rev-parse "refs/tags/${TAG}")"
          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{}")"
          test "$(git cat-file -t "${TAG_OBJECT}")" = "tag"
          test "$(git rev-parse HEAD)" = "${TAG_COMMIT}"
          test -s ".changelogs/${TAG}.md"
          echo "TAG_OBJECT=${TAG_OBJECT}" >> "${GITHUB_ENV}"
          echo "TAG_COMMIT=${TAG_COMMIT}" >> "${GITHUB_ENV}"

      - name: Verify
        uses: ./.github/actions/verify
        with:
          version: ${{ inputs.tag }}

      - name: 生成发布说明（changelog + 验证证据）
        shell: bash
        run: |
          python3 <<'PY'
          import hashlib
          import os
          from pathlib import Path

          tag = os.environ["TAG"]
          changelog = Path(f".changelogs/{tag}.md")
          jars = sorted(Path("build/libs").glob("*.jar"))
          if not jars:
              raise SystemExit("no jars in build/libs")

          evidence = [
              "",
              "---",
              "",
              "## 验证证据（由发布 workflow 自动生成）",
              "",
              f"- 发布提交：`{os.environ['TAG_COMMIT']}`（tag `{tag}`，tag 对象 `{os.environ['TAG_OBJECT']}`）",
              f"- 发布 run：{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "- 构建验证：setupCIWorkspace / test / check / build 全部通过（仓库内 `.github/actions/verify`，与分支 CI 同一份定义）",
              "- 资产：",
          ]
          for path in jars:
              data = path.read_bytes()
              evidence.append(f"  - `{path.name}`：{len(data)} bytes，sha256 `{hashlib.sha256(data).hexdigest()}`")
          notes = changelog.read_text(encoding="utf-8").rstrip() + "\n" + "\n".join(evidence) + "\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          print(f"release notes = changelog + 验证证据（{len(jars)} 个资产）")
          PY

      - name: 创建或更新 Release
        shell: bash
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [[ "${SNAPSHOT}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" ./build/libs/*.jar --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" --title "${TAG}" ${PRERELEASE_FLAG} ./build/libs/*.jar
          fi
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file release-notes.md

      - name: 校验 Release 资产齐全
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets,isDraft > release-state.json
          python3 <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("release-state.json").read_text(encoding="utf-8"))
          assets = [a for a in state["assets"] if a.get("state") == "uploaded"]
          if not assets:
              raise SystemExit("release has no uploaded assets")
          if state["isDraft"]:
              raise SystemExit("release is still a draft")
          for asset in sorted(assets, key=lambda a: a["name"]):
              print(f"{asset['name']} ({asset.get('size')} bytes)")
          PY

      - name: Publish to Maven / Modrinth / CurseForge
        # 三个渠道合并为一次 Gradle 调用；--continue 保证单渠道失败不阻断其它渠道。
        if: ${{ env.SNAPSHOT != 'true' && env.PRERELEASE != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          ./gradlew --continue --build-cache --info --stacktrace \
            -PmavenPublishUrl="${MAVEN_PUBLISHING_URL}" assemble publish -x test
