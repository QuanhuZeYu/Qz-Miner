repositories {
    mavenCentral()
    maven {
        name = "GTNHReleases"
        url = "https://nexus.gtnewhorizons.com/repository/releases/"
    }
    ivy {
        name = "UILibReleases"
        url = "https://github.com/QuanhuZeYu/Qz-UILib/releases/download"
        patternLayout { artifact("[revision]/[artifact]-[revision].[ext]") }
        metadataSources { artifact() }
        content { includeGroup("qz-uilib-release") }
    }
    if (project.hasProperty("uilibRepository")) {
        def local = maven {
            name = "UILibWorkspace"
            url = uri(project.property("uilibRepository"))
        }
        exclusiveContent {
            forRepositories(local)
            filter { includeGroup("asia.quanhuzeyu.uilib") }
        }
    }
}
