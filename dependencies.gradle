/*
 * Add your dependencies here. Supported configurations:
 *  - api("group:name:version:classifier"): if you use the types from this dependency in the public API of this mod
 *       Available at runtime and compiletime for mods depending on this mod
 *  - implementation("g:n:v:c"): if you need this for internal implementation details of the mod, but none of it is visible via the public API
 *       Available at runtime but not compiletime for mods depending on this mod
 *  - compileOnly("g:n:v:c"): if the mod you're building doesn't need this dependency during runtime at all, e.g. for optional mods
 *       Not available at all for mods depending on this mod, only visible at compiletime for this mod
 *  - compileOnlyApi("g:n:v:c"): like compileOnly, but also visible at compiletime for mods depending on this mod
 *       Available at compiletime but not runtime for mods depending on this mod
 *  - runtimeOnlyNonPublishable("g:n:v:c"): if you want to include a mod in this mod's runClient/runServer runs, but not publish it as a dependency
 *       Not available at all for mods depending on this mod, only visible at runtime for this mod
 *  - devOnlyNonPublishable("g:n:v:c"): a combination of runtimeOnlyNonPublishable and compileOnly for dependencies present at both compiletime and runtime,
 *       but not published as Maven dependencies - useful for RFG-deobfuscated dependencies or local testing
 *  - runtimeOnly("g:n:v:c"): if you don't need this at compile time, but want it to be present at runtime
 *       Available at runtime for mods depending on this mod
 *  - annotationProcessor("g:n:v:c"): mostly for java compiler plugins, if you know you need this, use it, otherwise don't worry
 *  - testCONFIG("g:n:v:c") - replace CONFIG by one of the above (except api), same as above but for the test sources instead of main
 *
 *  - shadowImplementation("g:n:v:c"): effectively the same as API, but the dependency is included in your jar under a renamed package name
 *       Requires you to enable usesShadowedDependencies in gradle.properties
 *
 *  - compile("g:n:v:c"): deprecated, replace with "api" (works like the old "compile") or "implementation" (can be more efficient)
 *
 * You can exclude transitive dependencies (dependencies of the chosen dependency) by appending { transitive = false } if needed,
 * but use this sparingly as it can break using your mod as another mod's dependency if you're not careful.
 *
 * To depend on obfuscated jars you can use `devOnlyNonPublishable(rfg.deobf("dep:spec:1.2.3"))` to fetch an obfuscated jar from maven,
 * or `devOnlyNonPublishable(rfg.deobf(project.files("libs/my-mod-jar.jar")))` to use a file.
 *
 * Gradle names for some of the configuration can be misleading, compileOnlyApi and runtimeOnly both get published as dependencies in Maven, but compileOnly does not.
 * The buildscript adds runtimeOnlyNonPublishable to also have a runtime dependency that's not published.
 *
 * For more details, see https://docs.gradle.org/8.0.1/userguide/java_library_plugin.html#sec:java_library_configurations_graph
 */
dependencies {
    // GTNH 基线唯一真源（对齐 Qz-UILib）：单值声明，不再经 gradle.properties 的 elytra.manifest.version
    elytraModpackVersion {
        setGtnhVersion("2.9.0-beta-3")
    }

    devOnlyNonPublishable(project.elytraModpackVersion.gtnhdev("GT5-Unofficial"))
    runtimeOnlyNonPublishable(project.elytraModpackVersion.gtnhdev("LootGames"))
    devOnlyNonPublishable(project.elytraModpackVersion.gtnhdev("GTNHLib"))
    runtimeOnlyNonPublishable(project.elytraModpackVersion.gtnhdev("NewHorizonsCoreMod"))
    runtimeOnlyNonPublishable(project.elytraModpackVersion.gtnhdev("Hodgepodge"))
    runtimeOnlyNonPublishable(project.elytraModpackVersion.gtnhdev("Galaxy-Space-GTNH"))
    // 运行时硬依赖 qz_uilib（@Mod required-after）；发布包不内嵌，由 modpack 安装
    // devOnlyNonPublishable = compileOnly + runtimeOnlyNonPublishable，不进入 test classpath
    // 4.7.0 起改用 libs 目录本地 devjar，不再经 JitPack 解析
    // 当前为含 HUD 公开编辑契约（HudEditTarget/HudEditService）+ overlay 相对倍率 + 锚定浮层跨树坐标换算 +
    // HUD 布局/缩放持久化端口（HudLayoutStore/HudLayoutPersistence）的本机构建 dev 制品：
    // 来源 Qz-UILib 提交 ecce000b（在 f3bae7a7 基础上新增「编辑态预览按自身倍率渲染与命中」「缩放后 tooltip 位置错修复」
    // 与「四角锚点 + 行程百分比 + 缩放百分比」持久化契约），已随 Qz-UILib 4.9.1 正式 Release 发布
    // （https://github.com/QuanhuZeYu/Qz-UILib/releases/tag/4.9.1，2026-09-11）：本 libs 件与 Release 资产
    // qz_uilib-4.9.1-dev.jar 逐字节一致（sha256 相同），可直接替换为该 Release 资产。
    // 构建时以 VERSION=4.9.1 注入版本（jar 内 mcmod.info version=4.9.1，满足 @Mod required-after:qz_uilib@[4.9.1,5.0.0)）；
    // sha256 1AB9DFE7427B2CED0BA205420AB4BD21518523C238D2807034E77AE7FDBEF9B9（3795995 bytes）；
    // ⚠ 同名同版本内容漂移：旧 4.9.1 件（7E0A8EF2…/57BAB4C2…）不含 HudLayoutStore/HudLayoutPersistence，
    // 混用会在类加载期 NoClassDefFoundError；QzUiLibArtifactContractTest 只判版本区间、识别不了内容漂移，
    // 集成与发布必须以本注释的 sha256 为准（详见 .changelogs/5.3.1.md「同版本内容漂移」条）。
    // 4.9.1 相对 4.9.0 为纯增量（公开面零删除零改签名），当时的 acceptableRemoteVersions [4.9.0,4.10.0) 同时接受两者
    // （该声明已于 2026-09-12 上抬为 [4.9.0,5.0.0)，原因见本段末尾「无法进入世界」修复说明）；
    // 该制品已于 2026-09-11 随 4.9.1 正式 Release 上线，资产 sha256 与本注释一致，无需再回填。
    // 【P2-B 开发期依赖切换·过渡态】P2-A 的候选源 SPI（PickerCandidateSource / PickerIconSource /
    // PickerIconCache / PickerRevisionBridge 等）只在 Qz-UILib 4.10.0 构建中存在；4.9.1 件不含新 SPI，
    // 会让 P2-B 代码无法编译。本行因此改指本机构建的 4.10.0 dev 制品：
    //   来源 = Qz-UILib 分支 4.0 HEAD f1385d60 + 「无法进入世界」修复（远端版本区间必须含自身构建版本）
    //   + 选择器结果网格末排裁切修复（轨道高按标签实际生效字号复核 I-2 内容底），命令
    //   VERSION=4.10.0 gradlew.bat --no-configuration-cache build --rerun-tasks（539 类 / 5602 例 / 0 失败 / 0 错误 / 7 跳过）；
    //   jar 内 mcmod.info version=4.10.0（满足 @Mod required-after:qz_uilib@[4.9.1,5.0.0)），
    //   sha256 56A9C0FBD9ABD2DB6E2039513219A032CE235660DC65C8868B90E0069EB31228（3926209 bytes）。
    //   内容漂移警示同 4.9.1 段：同版本名不同内容会在类加载期炸，集成与发布以本注释 sha256 为准。
    //   本件声明 acceptableRemoteVersions=[4.9.0,4.11.0)（同 major；上界取制品版本 4.10.0 的下一 minor 边界）。
    //   历史件（同名不同内容，禁止回退）：E18C5F6E…/3926208（声明为跨 major 的 [4.9.0,5.0.0)，多承诺一个 major）、
    //   A24A1532…/3925676（仅版本修复、无布局修复）、104B6940…/3925675（错声明 [4.9.0,4.10.0)，自我拒绝致无法进入世界）。
    //   ⚠ 更早一件（sha256 104B6940…/3925675 bytes）携带 UILib 侧声明 acceptableRemoteVersions=[4.9.0,4.10.0)，
    //   该区间开上界不含制品自身版本 4.10.0：FML 启动期报「mod qz_uilib appears to reject its own version
    //   number (4.10.0)」，进入世界时集成服务器 Rejecting connection CLIENT 后卸载全部维度（症状=无法进入世界）。
    //   现声明改为 [4.9.0,5.0.0)（与 Miner 依赖上界成对同源），并由 Qz-UILib 的
    //   FmlRemoteVersionCompatibilityContractTest#declaredRangeMustContainOwnBuildVersion 守卫
    //   「区间必须含自身构建版本」；禁止把本两行回退到 104B6940 件。
    // 过渡态删除条件（P6 成对升级，需用户确认）：Qz-UILib 出 5.0.0 Release 资产（T-1/T-6 旧路径删除的同一批）
    //   + Miner 把 @Mod 依赖上界同步到 5.0.0，此时本两行改指 5.0.0 Release 资产并删除本段注释。
    // 过渡态回退方式：4.8.0 / 4.9.0 / 4.9.1 三件旧 dev jar 已于 2026-09-12 从本仓 libs/ 移除（git 索引中为删除态），
    //   回退需先从 Qz-UILib Release 资产取回对应 dev jar 放回 libs/，再把下面两行的文件名改回去；
    //   回退后 P2-B 的新 SPI 代码无法编译，必须先 revert 对应的 Miner 提交。
    devOnlyNonPublishable(project.files("libs/qz_uilib-4.10.0-dev.jar"))
    testImplementation(project.files("libs/qz_uilib-4.10.0-dev.jar"))

    runtimeOnlyNonPublishable(project.elytraModpackVersion.gtnhdev("ServerUtilities"))
    runtimeOnlyNonPublishable(project.elytraModpackVersion.gtnhdev("NotEnoughItems"))
    runtimeOnlyNonPublishable(project.elytraModpackVersion.gtnhdev("Applied-Energistics-2-Unofficial"))
    runtimeOnlyNonPublishable(project.elytraModpackVersion.gtnhdev("AppleCore"))
    runtimeOnlyNonPublishable(project.elytraModpackVersion.gtnhdev("Angelica"))
    runtimeOnlyNonPublishable(project.elytraModpackVersion.gtnhdev("lwjgl3ify"))
    runtimeOnlyNonPublishable("ganymedes01.etfuturum:Et-Futurum-Requiem:${elytraModpackVersion["Et-Futurum-Requiem"]}")

    testImplementation("junit:junit:4.13.2")
}
